name: Build & Scan Docker image

on: 
  push:
    branches: [ "main", "Main" ]

permissions:
  contents: write
  packages: write

jobs:

  build-push-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/date-planner
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile

      - name: Trivy scan pushed image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
  
  update-manifest:
    runs-on: ubuntu-latest
    needs: build-push-scan
    steps:
      - name: Checkout (with write permissions)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update deployment image tag in manifest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/date-planner
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s|(image:\s*)(.+)|\1${IMAGE_NAME}:${IMAGE_TAG}|" manifests/base/deployment.yaml
          sed -i -E "s|(imagePullPolicy:\s*)Never|\1IfNotPresent|" manifests/base/deployment.yaml || true
          git add manifests/base/deployment.yaml
          git commit -m "ci: bump image to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"

      - name: Push manifest changes
        run: git push origin HEAD:${{ github.ref_name }}

