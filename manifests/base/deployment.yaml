apiVersion: apps/v1
kind: Deployment
metadata:
  name: date-planner
  labels:
    app: date-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: date-planner
  template:
    metadata:
      labels:
        app: date-planner
    spec:
      containers:
        - name: date-planner
          image: ghcr.io/soniah13/date-planner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
